name: Build and SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      # 1. تثبيت actions/checkout على SHA (لحل مشكلة S7637)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install GCC and Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile C++ Project
        run: |
          g++ -std=c++20 -Wall -Wextra -I include src/*.cpp -o cinema

      # 2. استخدام الـ SHA الصحيح لأحدث إصدار (v8.2.1)
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Ahmed-M-Elsayad_CinemaSystem
            -Dsonar.organization=ahmed-m-elsayad
            -Dsonar.sources=src,include
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/*.txt,**/*.md,**/docs/**,**/*.json
