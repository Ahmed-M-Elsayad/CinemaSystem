name: Build and SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      # 1. تثبيت actions/checkout على SHA (لحل مشكلة S7637)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install GCC and Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile C++ Project
        run: |
          g++ -std=c++20 -Wall -Wextra -I include src/*.cpp -o cinema

      # 2. استخدام الـ SHA الصحيح للأداة (لحل مشكلة S7637)
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@b1f8cb86201555b58840109a3cb3c2741263599a # v5.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Ahmed-M-Elsayad_CinemaSystem
            -Dsonar.organization=ahmed-m-elsayad
            -Dsonar.sources=src,include
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/*.txt,**/*.md,**/docs/**,**/*.json
