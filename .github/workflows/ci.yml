name: Build and SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # required by SonarCloud for accurate blame info

      - name: Install dependencies (gcovr & Build Wrapper)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr
          wget -q https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -q build-wrapper-linux-x86.zip

      - name: Build with build-wrapper
        run: |
          ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
            g++ -std=c++20 -Wall -Wextra -I include src/*.cpp -o cinema

      - name: Compile and run tests with coverage
        run: |
          # main.cpp مستثنى لتجنب تعارض دالة main مع ملف الاختبارات
          g++ -std=c++20 -Wall -Wextra --coverage -I include \
            $(find src -name "*.cpp" ! -name "main.cpp") tests/*.cpp -o cinema_tests
          ./cinema_tests

          # تقرير التغطية بصيغة SonarQube (لكود src/ فقط)
          gcovr -r . --filter 'src/' --sonarqube coverage.xml

          # ملخص التغطية في الـ Logs
          gcovr -r . --filter 'src/'

      - name: Run SonarCloud analysis
        # يتخطى الخطوة لو التوكن غير متاح (مثل PR قادم من Fork)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v4.2.1
        with:
          args: >
            -Dsonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json