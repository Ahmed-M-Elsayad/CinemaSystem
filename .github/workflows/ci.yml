name: Build and SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC and Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile C++ Project
        run: |
          g++ -std=c++20 -Wall -Wextra -I include src/*.cpp -o cinema

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Ahmed-M-Elsayad_CinemaSystem
            -Dsonar.organization=ahmed-m-elsayad
            -Dsonar.sources=src
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/*.txt,**/*.md,**/docs/**,**/*.json