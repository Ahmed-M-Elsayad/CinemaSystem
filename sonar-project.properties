# ============================================================
# SonarCloud Configuration for CinemaSystem
# ============================================================

# رابط المشروع على SonarCloud
sonar.projectKey=Ahmed-M-Elsayad_CinemaSystem
sonar.organization=ahmed-m-elsayad

# معلومات المشروع
sonar.projectName=CinemaSystem
sonar.projectVersion=1.0

# مكان الكود المصدري (فولدر src بس)
sonar.sources=src

# ترميز النصوص
sonar.sourceEncoding=UTF-8

# استبعاد ملفات معينة من التحليل
sonar.exclusions=**/*.md, **/*.txt, docs/**, data/**, **/*.json