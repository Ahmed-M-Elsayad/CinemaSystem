sonar.projectKey=Ahmed-M-Elsayad_CinemaSystem
sonar.organization=ahmed-m-elsayad
sonar.projectName=CinemaSystem
sonar.sourceEncoding=UTF-8
sonar.cfamily.cpp.std=c++20

# مسارات الكود والاختبارات
sonar.sources=src,include
sonar.tests=tests
sonar.test.inclusions=tests/**

# ملف التغطية اللي الـ CI بيولّده (اسم الخاصية الصحيح: coverageReportPaths)
sonar.coverageReportPaths=coverage.xml

# استثناء الملفات اللي مش محتاجة Unit Tests (تم إزالة find* لاختبارها)
sonar.coverage.exclusions=src/main.cpp,src/clearScreen.cpp,src/pressEnterToContinue.cpp,src/admin*.cpp,src/createBooking.cpp,src/modifyBooking.cpp,src/cancelBooking.cpp,src/load*.cpp,src/save*.cpp,src/display*.cpp,src/get*Input.cpp,src/show*.cpp,src/seedData.cpp,src/exportTicketToFile.cpp,src/printHeader.cpp,src/printTicket.cpp,src/bookingHelpers.cpp,src/find*.cpp